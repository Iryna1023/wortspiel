<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wortsuchrätsel (A1-A2)</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            color: #333;
            text-align: center;
            padding: 20px;
            margin: 0;
            -webkit-tap-highlight-color: transparent;
        }
        h1 {
            color: #2c3e50;
            font-size: 1.5rem;
            margin-bottom: 10px;
        }
        .container {
            max-width: 400px;
            width: 100%;
            box-sizing: border-box;
            margin: 0 auto;
            background: #fff;
            padding: 15px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(10, 1fr);
            gap: 4px;
            margin: 15px 0;
        }
        .cell {
            aspect-ratio: 1;
            background: #eef2f7;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 0.9rem;
            border-radius: 4px;
            cursor: pointer;
            user-select: none;
            -webkit-user-select: none;
            transition: background 0.2s;
        }
        .cell.selected {
            background: #3498db;
            color: white;
        }
        .cell.found {
            background: #2ecc71;
            color: white;
        }
        .word-list {
            text-align: left;
            margin-top: 15px;
            font-size: 0.85rem;
            background: #f9f9fb;
            padding: 10px;
            border-radius: 6px;
        }
        .word-list ul {
            margin: 5px 0 0 20px;
            padding: 0;
        }
        .word-item.found {
            text-decoration: line-through;
            color: #7f8c8d;
        }
        .btn-container {
            margin-top: 15px;
            display: flex;
            gap: 10px;
            justify-content: center;
        }
        button {
            padding: 8px 14px;
            border: none;
            background: #3498db;
            color: white;
            border-radius: 5px;
            cursor: pointer;
            font-size: 0.9rem;
        }
        button:active {
            background: #2980b9;
        }
        #message {
            margin-top: 10px;
            font-weight: bold;
            color: #27ae60;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Wortsuchrätsel</h1>
    <p style="font-size: 0.8rem; color: #666; margin-top:0;">Найдите 10 слов по теме «Компания»</p>
    
    <div class="grid" id="grid"></div>
    
    <div class="btn-container">
        <button onclick="checkSelection()">Проверить слово</button>
        <button onclick="resetGame()" style="background: #95a5a6;">Сброс</button>
    </div>

    <div id="message"></div>

    <div class="word-list">
        <strong>Слова для поиска (A1-A2):</strong>
        <ul id="wordListUI"></ul>
    </div>
</div>

<script>
    const words = [
        { de: "ARBEITEN", ru: "работать" },
        { de: "LEITEN", ru: "управлять" },
        { de: "VERKAUFEN", ru: "продавать" },
        { de: "KAUFEN", ru: "покупать" },
        { de: "PLANEN", ru: "планировать" },
        { de: "VERDIENEN", ru: "зарабатывать" },
        { de: "BEZAHLEN", ru: "платить" },
        { de: "BESTELLEN", ru: "заказывать" },
        { de: "LIEFERN", ru: "поставлять" },
        { de: "FIRMA", ru: "фирма" }
    ];

    const size = 10;
    let grid = Array(size).fill(null).map(() => Array(size).fill(''));
    let selectedCells = [];
    let foundWords = new Set();

    function placeWords() {
        grid = Array(size).fill(null).map(() => Array(size).fill(''));

        // Упрощенное размещение по горизонтали и вертикали (ваш оригінальний код)
        const placements = [
            {r: 0, c: 0, h: true, w: "ARBEITEN"},
            {r: 1, c: 0, h: true, w: "FIRMA"},
            {r: 2, c: 0, h: true, w: "LEITEN"},
            {r: 3, c: 0, h: true, w: "VERKAUFEN"},
            {r: 4, c: 0, h: true, w: "KAUFEN"},
            {r: 5, c: 0, h: true, w: "PLANEN"},
            {r: 6, c: 0, h: true, w: "VERDIENEN"},
            {r: 7, c: 0, h: true, w: "BEZAHLEN"},
            {r: 8, c: 0, h: true, w: "BESTELLEN"},
            {r: 9, c: 0, h: true, w: "LIEFERN"}
        ];

        placements.forEach(p => {
            for (let i = 0; i < p.w.length; i++) {
                if (p.h) grid[p.r][p.c + i] = p.w[i];
            }
        });

        // Заполняем пустоту случайными буквами
        const alphabet = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
        for (let r = 0; r < size; r++) {
            for (let c = 0; c < size; c++) {
                if (!grid[r][c]) {
                    grid[r][c] = alphabet[Math.floor(Math.random() * alphabet.length)];
                }
            }
        }
    }

    function renderGrid() {
        const gridEl = document.getElementById('grid');
        gridEl.innerHTML = '';
        for (let r = 0; r < size; r++) {
            for (let c = 0; c < size; c++) {
                const cell = document.createElement('div');
                cell.className = 'cell';
                cell.dataset.row = r;
                cell.dataset.col = c;
                cell.textContent = grid[r][c];
                // Ваш точний оригінальний клік:
                cell.onclick = () => toggleCell(cell, r, c);
                gridEl.appendChild(cell);
            }
        }
    }

    function renderWordList() {
        const listEl = document.getElementById('wordListUI');
        listEl.innerHTML = '';
        words.forEach(w => {
            const li = document.createElement('li');
            li.className = 'word-item ' + (foundWords.has(w.de) ? 'found' : '');
            li.textContent = `${w.de} — ${w.ru}`;
            listEl.appendChild(li);
        });
    }

    function toggleCell(cell, r, c) {
        if (cell.classList.contains('found')) return;
        cell.classList.toggle('selected');
        const index = selectedCells.findIndex(item => item.r === r && item.c === c);
        if (index > -1) {
            selectedCells.splice(index, 1);
        } else {
            selectedCells.push({r, c});
        }
    }

    function checkSelection() {
        selectedCells.sort((a, b) => a.r - b.r || a.c - b.c);
        let wordStr = selectedCells.map(item => grid[item.r][item.c]).join('');
        
        let matched = words.find(w => w.de === wordStr || w.de === wordStr.split('').reverse().join(''));
        
        const msg = document.getElementById('message');
        if (matched && !foundWords.has(matched.de)) {
            foundWords.add(matched.de);
            selectedCells.forEach(item => {
                const cellEl = document.querySelector(`[data-row='${item.r}'][data-col='${item.c}']`);
                if (cellEl) {
                    cellEl.classList.remove('selected');
                    cellEl.classList.add('found');
                }
            });
            msg.textContent = `Найдено слово: ${matched.de}!`;
            setTimeout(() => msg.textContent = '', 2000);
        } else {
            msg.textContent = 'Неверно, попробуйте еще раз';
            msg.style.color = '#e74c3c';
            setTimeout(() => {
                msg.textContent = '';
                msg.style.color = '#27ae60';
            }, 2000);
            document.querySelectorAll('.cell.selected').forEach(c => c.classList.remove('selected'));
        }
        selectedCells = [];
        renderWordList();

        if (foundWords.size === words.length) {
            msg.textContent = 'Поздравляем! Все слова найдены!';
        }
    }

    function resetGame() {
        foundWords.clear();
        selectedCells = [];
        document.getElementById('message').textContent = '';
        placeWords();
        renderGrid();
        renderWordList();
    }

    placeWords();
    renderGrid();
    renderWordList();
</script>

</body>
</html>
