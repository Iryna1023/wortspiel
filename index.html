<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wortsuchrätsel (A1-A2)</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            color: #333;
            text-align: center;
            padding: 15px;
            margin: 0;
            -webkit-tap-highlight-color: transparent;
        }
        h1 {
            color: #2c3e50;
            font-size: 1.5rem;
            margin-bottom: 10px;
        }
        .container {
            max-width: 400px;
            width: 100%;
            box-sizing: border-box;
            margin: 0 auto;
            background: #fff;
            padding: 15px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(10, 1fr);
            gap: 4px;
            margin: 15px 0;
        }
        .cell {
            aspect-ratio: 1;
            background: #eef2f7;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 0.9rem;
            border-radius: 4px;
            cursor: pointer;
            user-select: none;
            -webkit-user-select: none;
        }
        .cell.selected {
            background: #3498db;
            color: white;
        }
        .cell.found {
            background: #2ecc71;
            color: white;
        }
        .word-list {
            text-align: left;
            margin-top: 15px;
            font-size: 0.85rem;
            background: #f9f9fb;
            padding: 10px;
            border-radius: 6px;
        }
        .word-list ul {
            margin: 5px 0 0 20px;
            padding: 0;
        }
        .word-item.found {
            text-decoration: line-through;
            color: #7f8c8d;
        }
        .btn-container {
            margin-top: 15px;
            display: flex;
            gap: 10px;
            justify-content: center;
        }
        button {
            padding: 8px 14px;
            border: none;
            background: #3498db;
            color: white;
            border-radius: 5px;
            cursor: pointer;
            font-size: 0.9rem;
        }
        button:active {
            background: #2980b9;
        }
        #message {
            margin-top: 10px;
            font-weight: bold;
            color: #27ae60;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Wortsuchrätsel</h1>
    <p style="font-size: 0.8rem; color: #666; margin-top:0;">Найдите 10 слов по теме «Компания»</p>
    
    <div class="grid" id="grid"></div>
    
    <div class="btn-container">
        <button onclick="checkSelection()">Проверить слово</button>
        <button onclick="resetGame()" style="background: #95a5a6;">Сброс</button>
    </div>

    <div id="message"></div>

    <div class="word-list">
        <strong>Слова для поиска (A1-A2):</strong>
        <ul id="wordListUI"></ul>
    </div>
</div>

<script>
    var words = [
        { de: "ARBEITEN", ru: "работать" },
        { de: "LEITEN", ru: "управлять" },
        { de: "VERKAUFEN", ru: "продавать" },
        { de: "KAUFEN", ru: "покупать" },
        { de: "PLANEN", ru: "планировать" },
        { de: "VERDIENEN", ru: "зарабатывать" },
        { de: "BEZAHLEN", ru: "платить" },
        { de: "BESTELLEN", ru: "заказывать" },
        { de: "LIEFERN", ru: "поставлять" },
        { de: "FIRMA", ru: "фирма" }
    ];

    var size = 10;
    var grid = [];
    var selectedCells = [];
    var foundWords = [];

    function placeWords() {
        grid = [];
        for (var r = 0; r < size; r++) {
            grid[r] = [];
            for (var c = 0; c < size; c++) {
                grid[r][c] = '';
            }
        }

        var placements = [
            {r: 0, c: 0, h: true, w: "ARBEITEN"},
            {r: 1, c: 0, h: true, w: "FIRMA"},
            {r: 2, c: 0, h: true, w: "LEITEN"},
            {r: 3, c: 0, h: true, w: "VERKAUFEN"},
            {r: 4, c: 0, h: true, w: "KAUFEN"},
            {r: 5, c: 0, h: true, w: "PLANEN"},
            {r: 6, c: 0, h: true, w: "VERDIENEN"},
            {r: 7, c: 0, h: true, w: "BEZAHLEN"},
            {r: 8, c: 0, h: true, w: "BESTELLEN"},
            {r: 9, c: 0, h: true, w: "LIEFERN"}
        ];

        placements.forEach(function(p) {
            for (var i = 0; i < p.w.length; i++) {
                if (p.h) grid[p.r][p.c + i] = p.w[i];
            }
        });

        var alphabet = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
        for (var r = 0; r < size; r++) {
            for (var c = 0; c < size; c++) {
                if (!grid[r][c]) {
                    grid[r][c] = alphabet[Math.floor(Math.random() * alphabet.length)];
                }
            }
        }
    }

    function renderGrid() {
        var gridEl = document.getElementById('grid');
        gridEl.innerHTML = '';
        for (var r = 0; r < size; r++) {
            for (var c = 0; c < size; c++) {
                var cell = document.createElement('div');
                cell.className = 'cell';
                cell.setAttribute('data-row', r);
                cell.setAttribute('data-col', c);
                cell.textContent = grid[r][c];
                
                (function(cel, row, col) {
                    cel.onclick = function() {
                        toggleCell(cel, row, col);
                    };
                })(cell, r, c);

                gridEl.appendChild(cell);
            }
        }
    }

    function renderWordList() {
        var listEl = document.getElementById('wordListUI');
        listEl.innerHTML = '';
        words.forEach(function(w) {
            var li = document.createElement('li');
            var isFound = foundWords.indexOf(w.de) > -1;
            li.className = 'word-item ' + (isFound ? 'found' : '');
            li.textContent = w.de + ' — ' + w.ru;
            listEl.appendChild(li);
        });
    }

    function toggleCell(cell, r, c) {
        if (cell.classList.contains('found')) return;
        cell.classList.toggle('selected');
        
        var index = -1;
        for (var i = 0; i < selectedCells.length; i++) {
            if (selectedCells[i].r === r && selectedCells[i].c === c) {
                index = i;
                break;
            }
        }

        if (index > -1) {
            selectedCells.splice(index, 1);
        } else {
            selectedCells.push({r: r, c: c});
        }
    }

    function checkSelection() {
        selectedCells.sort(function(a, b) {
            return a.r - b.r || a.c - b.c;
        });

        var wordStr = '';
        for (var i = 0; i < selectedCells.length; i++) {
            wordStr += grid[selectedCells[i].r][selectedCells[i].c];
        }

        var matched = null;
        for (var i = 0; i < words.length; i++) {
            var wRev = words[i].de.split('').reverse().join('');
            if (words[i].de === wordStr || words[i].de === wRev) {
                matched = words[i];
                break;
            }
        }

        var msg = document.getElementById('message');
        if (matched && foundWords.indexOf(matched.de) === -1) {
            foundWords.push(matched.de);
            selectedCells.forEach(function(item) {
                var cellEl = document.querySelector('[data-row="' + item.r + '"][data-col="' + item.c + '"]');
                if (cellEl) {
                    cellEl.classList.remove('selected');
                    cellEl.classList.add('found');
                }
            });
            msg.textContent = 'Найдено слово: ' + matched.de + '!';
            setTimeout(function() { msg.textContent = ''; }, 2000);
        } else {
            msg.textContent = 'Неверно, попробуйте еще раз';
            msg.style.color = '#e74c3c';
            setTimeout(function() {
                msg.textContent = '';
                msg.style.color = '#27ae60';
            }, 2000);
            var selectedEls = document.querySelectorAll('.cell.selected');
            for (var i = 0; i < selectedEls.length; i++) {
                selectedEls[i].classList.remove('selected');
            }
        }
        selectedCells = [];
        renderWordList();

        if (foundWords.length === words.length) {
            msg.textContent = 'Поздравляем! Все слова найдены!';
        }
    }

    function resetGame() {
        foundWords = [];
        selectedCells = [];
        document.getElementById('message').textContent = '';
        placeWords();
        renderGrid();
        renderWordList();
    }

    placeWords();
    renderGrid();
    renderWordList();
</script>

</body>
</html>
