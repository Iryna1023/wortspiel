<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wortsuchrätsel (A1-A2)</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            color: #333;
            text-align: center;
            padding: 15px;
            margin: 0;
            -webkit-user-select: none;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        h1 {
            color: #2c3e50;
            font-size: 1.5rem;
            margin-bottom: 5px;
        }
        .container {
            max-width: 400px;
            width: 100%;
            box-sizing: border-box;
            margin: 0 auto;
            background: #fff;
            padding: 15px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(10, 1fr);
            gap: 4px;
            margin: 15px 0;
            touch-action: none; /* Вимикає стандартний скрол під час виділення на телефоні */
        }
        .cell {
            aspect-ratio: 1;
            background: #eef2f7;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 0.9rem;
            border-radius: 4px;
            cursor: pointer;
            transition: background 0.15s, color 0.15s;
        }
        .cell.selected {
            background: #3498db !important;
            color: white !important;
        }
        .cell.found {
            background: #2ecc71 !important;
            color: white !important;
        }
        .word-list {
            text-align: left;
            margin-top: 15px;
            font-size: 0.85rem;
            background: #f9f9fb;
            padding: 10px;
            border-radius: 6px;
        }
        .word-list ul {
            margin: 5px 0 0 20px;
            padding: 0;
        }
        .word-item.found {
            text-decoration: line-through;
            color: #7f8c8d;
        }
        .btn-container {
            margin-top: 15px;
            display: flex;
            gap: 10px;
            justify-content: center;
        }
        button {
            padding: 8px 14px;
            border: none;
            background: #3498db;
            color: white;
            border-radius: 5px;
            cursor: pointer;
            font-size: 0.9rem;
        }
        button:active {
            background: #2980b9;
        }
        #message {
            margin-top: 10px;
            font-weight: bold;
            color: #27ae60;
            font-size: 0.9rem;
            min-height: 1.2rem;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Wortsuchrätsel</h1>
    <p style="font-size: 0.8rem; color: #666; margin-top:0;">Znajdź 10 słów na temat „Firma”</p>
    
    <div class="grid" id="grid"></div>
    
    <div class="btn-container">
        <button onclick="resetGame()" style="background: #95a5a6;">Reset</button>
    </div>

    <div id="message"></div>

    <div class="word-list">
        <strong>Słowa do znalezienia (A1-A2):</strong>
        <ul id="wordListUI"></ul>
    </div>
</div>

<script>
    const words = [
        { de: "ARBEITEN", pl: "pracować" },
        { de: "LEITEN", pl: "zarządzać" },
        { de: "VERKAUFEN", pl: "sprzedawać" },
        { de: "KAUFEN", pl: "kupować" },
        { de: "PLANEN", pl: "planować" },
        { de: "VERDIENEN", pl: "zarabiać" },
        { de: "BEZAHLEN", pl: "płacić" },
        { de: "BESTELLEN", pl: "zamawiać" },
        { de: "LIEFERN", pl: "dostarczać" },
        { de: "FIRMA", pl: "firma" }
    ];

    const size = 10;
    let grid = [];
    let selectedCells = [];
    let foundWords = new Set();
    let isMouseDown = false;

    function placeWords() {
        let success = false;
        while (!success) {
            grid = Array(size).fill(null).map(() => Array(size).fill(''));
            let placedCount = 0;
            const sortedWords = [...words].sort((a, b) => b.de.length - a.de.length);

            for (let item of sortedWords) {
                const word = item.de;
                let placed = false;
                let attempts = 0;

                while (!placed && attempts < 200) {
                    attempts++;
                    const horizontal = Math.random() < 0.5;
                    const r = Math.floor(Math.random() * size);
                    const c = Math.floor(Math.random() * size);

                    if (horizontal && c + word.length <= size) {
                        let canPlace = true;
                        for (let i = 0; i < word.length; i++) {
                            if (grid[r][c + i] !== '' && grid[r][c + i] !== word[i]) {
                                canPlace = false;
                                break;
                            }
                        }
                        if (canPlace) {
                            for (let i = 0; i < word.length; i++) {
                                grid[r][c + i] = word[i];
                            }
                            placed = true;
                            placedCount++;
                        }
                    } else if (!horizontal && r + word.length <= size) {
                        let canPlace = true;
                        for (let i = 0; i < word.length; i++) {
                            if (grid[r + i][c] !== '' && grid[r + i][c] !== word[i]) {
                                canPlace = false;
                                break;
                            }
                        }
                        if (canPlace) {
                            for (let i = 0; i < word.length; i++) {
                                grid[r + i][c] = word[i];
                            }
                            placed = true;
                            placedCount++;
                        }
                    }
                }
            }
            if (placedCount === words.length) success = true;
        }

        const alphabet = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
        for (let r = 0; r < size; r++) {
            for (let c = 0; c < size; c++) {
                if (!grid[r][c]) {
                    grid[r][c] = alphabet[Math.floor(Math.random() * alphabet.length)];
                }
            }
        }
    }

    function renderGrid() {
        const gridEl = document.getElementById('grid');
        gridEl.innerHTML = '';
        for (let r = 0; r < size; r++) {
            for (let c = 0; c < size; c++) {
                const cell = document.createElement('div');
                cell.className = 'cell';
                cell.dataset.row = r;
                cell.dataset.col = c;
                cell.textContent = grid[r][c];
                gridEl.appendChild(cell);
            }
        }
    }

    function renderWordList() {
        const listEl = document.getElementById('wordListUI');
        listEl.innerHTML = '';
        words.forEach(w => {
            const li = document.createElement('li');
            li.className = 'word-item ' + (foundWords.has(w.de) ? 'found' : '');
            li.textContent = `${w.de} — ${w.pl}`;
            listEl.appendChild(li);
        });
    }

    // Логіка виділення слайдом (мишкою та пальцем)
    const gridElement = document.getElementById('grid');

    function getCellFromPoint(x, y) {
        const element = document.elementFromPoint(x, y);
        if (element && element.classList.contains('cell')) {
            return element;
        }
        return null;
    }

    function handleTouchStart(e) {
        isMouseDown = true;
        selectedCells = [];
        clearSelectionUI();
        const touch = e.touches[0];
        const cell = getCellFromPoint(touch.clientX, touch.clientY);
        if (cell) addCellToSelection(cell);
    }

    function handleTouchMove(e) {
        if (!isMouseDown) return;
        const touch = e.touches[0];
        const cell = getCellFromPoint(touch.clientX, touch.clientY);
        if (cell) addCellToSelection(cell);
    }

    function handleTouchEnd() {
        if (!isMouseDown) return;
        isMouseDown = false;
        checkSelection();
    }

    function handleMouseDown(e) {
        isMouseDown = true;
        selectedCells = [];
        clearSelectionUI();
        if (e.target.classList.contains('cell')) {
            addCellToSelection(e.target);
        }
    }

    function handleMouseOver(e) {
        if (!isMouseDown) return;
        if (e.target.classList.contains('cell')) {
            addCellToSelection(e.target);
        }
    }

    function handleMouseUp() {
        if (!isMouseDown) return;
        isMouseDown = false;
        checkSelection();
    }

    function addCellToSelection(cell) {
        if (cell.classList.contains('found')) return;
        const r = parseInt(cell.dataset.row);
        const c = parseInt(cell.dataset.col);
        
        if (!selectedCells.some(item => item.r === r && item.c === c)) {
            selectedCells.push({ r, c, element: cell });
            cell.classList.add('selected');
        }
    }

    function clearSelectionUI() {
        document.querySelectorAll('.cell.selected').forEach(c => c.classList.remove('selected'));
    }

    function checkSelection() {
        if (selectedCells.length === 0) return;

        selectedCells.sort((a, b) => a.r - b.r || a.c - b.c);
        let wordStr = selectedCells.map(item => grid[item.r][item.c]).join('');
        let matched = words.find(w => w.de === wordStr || w.de === wordStr.split('').reverse().join(''));

        const msg = document.getElementById('message');
        if (matched && !foundWords.has(matched.de)) {
            foundWords.add(matched.de);
            selectedCells.forEach(item => {
                item.element.classList.remove('selected');
                item.element.classList.add('found');
            });
            msg.style.color = '#27ae60';
            msg.textContent = `Znaleziono słowo: ${matched.de}!`;
            setTimeout(() => msg.textContent = '', 2000);
        } else {
            msg.style.color = '#e74c3c';
            msg.textContent = 'Niepoprawnie';
            setTimeout(() => {
                msg.textContent = '';
            }, 1500);
            clearSelectionUI();
        }

        selectedCells = [];
        renderWordList();

        if (foundWords.size === words.length) {
            msg.style.color = '#27ae60';
            msg.textContent = 'Gratulacje! Wszystkie słowa znalezione!';
        }
    }

    // Підписка на події миші та тач-скрину
    gridElement.addEventListener('mousedown', handleMouseDown);
    gridElement.addEventListener('mouseover', handleMouseOver);
    document.addEventListener('mouseup', handleMouseUp);

    gridElement.addEventListener('touchstart', handleTouchStart, { passive: true });
    gridElement.addEventListener('touchmove', handleTouchMove, { passive: true });
    document.addEventListener('touchend', handleTouchEnd);

    function resetGame() {
        foundWords.clear();
        selectedCells = [];
        document.getElementById('message').textContent = '';
        placeWords();
        renderGrid();
        renderWordList();
    }

    resetGame();
</script>

</body>
</html>
