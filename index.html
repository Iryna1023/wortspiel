
<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#f4f4f9">
    <title>Wortsuchrätsel – Deutsch A1-A2</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f4f9;
            color: #333;
            text-align: center;
            padding: 15px;
            margin: 0;
        }

        h1 {
            color: #2c3e50;
            font-size: 1.6rem;
            margin-bottom: 8px;
        }

        .container {
            max-width: 450px;
            margin: 0 auto;
            background: white;
            padding: 16px;
            border-radius: 14px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        .subtitle {
            font-size: 0.9rem;
            color: #666;
        }

        .progress {
            font-weight: bold;
            color: #2980b9;
            margin: 15px 0;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(10, minmax(0, 1fr));
            gap: 4px;
            margin: 15px 0;
            touch-action: manipulation;
            user-select: none;
        }

        .cell {
            aspect-ratio: 1;
            background: #eef2f7;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: clamp(11px, 3.5vw, 16px);
            border-radius: 4px;
            cursor: pointer;
            user-select: none;
            transition: background 0.15s;
            min-width: 0;
        }

        .cell.selected {
            background: #3498db;
            color: white;
        }

        .cell.found {
            background: #2ecc71;
            color: white;
        }

        .word-list {
            text-align: left;
            margin-top: 15px;
            font-size: 0.9rem;
            background: #f9f9fb;
            padding: 12px;
            border-radius: 8px;
        }

        .word-list ul {
            margin: 8px 0 0 20px;
            padding: 0;
        }

        .word-item {
            margin: 5px 0;
        }

        .word-item.found {
            text-decoration: line-through;
            color: #27ae60;
        }

        .btn-container {
            margin-top: 15px;
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
        }

        button {
            padding: 11px 16px;
            border: none;
            background: #3498db;
            color: white;
            border-radius: 7px;
            cursor: pointer;
            font-size: 0.9rem;
        }

        button:active {
            transform: scale(0.97);
        }

        #message {
            margin-top: 12px;
            font-weight: bold;
            color: #27ae60;
            font-size: 0.95rem;
            min-height: 22px;
        }

        @media (max-width: 360px) {
            body {
                padding: 8px;
            }

            .container {
                padding: 10px;
            }

            .grid {
                gap: 2px;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Wortsuchrätsel</h1>

    <p class="subtitle">
        Знайдіть 10 слів на тему «Компанія»
    </p>

    <div class="progress" id="progress">
        Знайдено: 0 / 10
    </div>

    <div class="grid" id="grid"></div>

    <div class="btn-container">
        <button onclick="checkSelection()">
            Перевірити слово
        </button>

        <button onclick="resetGame()" style="background:#95a5a6">
            Нова гра
        </button>
    </div>

    <div id="message" aria-live="polite"></div>

    <div class="word-list">
        <strong>Слова для пошуку (A1-A2):</strong>
        <ul id="wordListUI"></ul>
    </div>

</div>

<script>

const words = [
    { de: "ARBEITEN", ru: "працювати" },
    { de: "LEITEN", ru: "управляти" },
    { de: "VERKAUFEN", ru: "продавати" },
    { de: "KAUFEN", ru: "купувати" },
    { de: "PLANEN", ru: "планувати" },
    { de: "VERDIENEN", ru: "заробляти" },
    { de: "BEZAHLEN", ru: "платити" },
    { de: "BESTELLEN", ru: "замовляти" },
    { de: "LIEFERN", ru: "постачати" },
    { de: "FIRMA", ru: "фірма" }
];

const size = 10;

let grid = [];
let selectedCells = [];
let foundWords = new Set();

const placements = [
    {r: 0, c: 0, w: "ARBEITEN", dr: 0, dc: 1},
    {r: 1, c: 0, w: "FIRMA", dr: 0, dc: 1},
    {r: 2, c: 0, w: "LEITEN", dr: 0, dc: 1},
    {r: 3, c: 0, w: "VERKAUFEN", dr: 0, dc: 1},
    {r: 4, c: 0, w: "KAUFEN", dr: 0, dc: 1},
    {r: 5, c: 0, w: "PLANEN", dr: 0, dc: 1},
    {r: 6, c: 0, w: "VERDIENEN", dr: 0, dc: 1},
    {r: 7, c: 0, w: "BEZAHLEN", dr: 0, dc: 1},
    {r: 8, c: 0, w: "BESTELLEN", dr: 0, dc: 1},
    {r: 9, c: 0, w: "LIEFERN", dr: 0, dc: 1}
];

function placeWords() {

    grid = Array.from(
        {length: size},
        () => Array(size).fill("")
    );

    placements.forEach(p => {
        for (let i = 0; i < p.w.length; i++) {
            grid[p.r + p.dr * i][p.c + p.dc * i] = p.w[i];
        }
    });

    const alphabet = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";

    for (let r = 0; r < size; r++) {
        for (let c = 0; c < size; c++) {

            if (!grid[r][c]) {
                grid[r][c] =
                    alphabet[Math.floor(Math.random() * alphabet.length)];
            }

        }
    }
}

function renderGrid() {

    const gridEl = document.getElementById("grid");
    gridEl.innerHTML = "";

    for (let r = 0; r < size; r++) {

        for (let c = 0; c < size; c++) {

            const cell = document.createElement("div");

            cell.className = "cell";
            cell.dataset.row = r;
            cell.dataset.col = c;
            cell.textContent = grid[r][c];

            cell.addEventListener("click", () => {
                toggleCell(cell, r, c);
            });

            gridEl.appendChild(cell);

        }
    }
}

function renderWordList() {

    const listEl = document.getElementById("wordListUI");
    listEl.innerHTML = "";

    words.forEach(w => {

        const li = document.createElement("li");

        li.className =
            "word-item " +
            (foundWords.has(w.de) ? "found" : "");

        li.textContent = `${w.de} — ${w.ru}`;

        listEl.appendChild(li);

    });

    document.getElementById("progress").textContent =
        `Знайдено: ${foundWords.size} / ${words.length}`;
}

function toggleCell(cell, r, c) {

    if (cell.classList.contains("found")) return;

    const index = selectedCells.findIndex(
        item => item.r === r && item.c === c
    );

    if (index > -1) {

        selectedCells.splice(index, 1);
        cell.classList.remove("selected");

    } else {

        selectedCells.push({r, c});
        cell.classList.add("selected");

    }
}

function checkSelection() {

    const msg = document.getElementById("message");

    if (selectedCells.length < 2) {
        msg.style.color = "#e74c3c";
        msg.textContent = "Виберіть букви слова!";
        return;
    }

    const first = selectedCells[0];
    const last = selectedCells[selectedCells.length - 1];

    const dr = Math.sign(last.r - first.r);
    const dc = Math.sign(last.c - first.c);

    const straightLine =
        dr === 0 || dc === 0 ||
        Math.abs(last.r - first.r) === Math.abs(last.c - first.c);

    const correctOrder =
        selectedCells.every((item, index) =>
            item.r === first.r + dr * index &&
            item.c === first.c + dc * index
        );

    const wordStr = selectedCells
        .map(item => grid[item.r][item.c])
        .join("");

    const matched = words.find(w =>
        !foundWords.has(w.de) &&
        (w.de === wordStr || w.de === wordStr.split("").reverse().join(""))
    );

    if (matched && straightLine && correctOrder) {

        foundWords.add(matched.de);

        selectedCells.forEach(item => {

            const cellEl = document.querySelector(
                `[data-row="${item.r}"][data-col="${item.c}"]`
            );

            cellEl.classList.remove("selected");
            cellEl.classList.add("found");

        });

        msg.style.color = "#27ae60";
        msg.textContent = `Чудово! Знайдено слово: ${matched.de}!`;

    } else {

        msg.style.color = "#e74c3c";
        msg.textContent = "Неправильно. Спробуйте ще раз!";

        selectedCells.forEach(item => {

            const cellEl = document.querySelector(
                `[data-row="${item.r}"][data-col="${item.c}"]`
            );

            if (cellEl) {
                cellEl.classList.remove("selected");
            }

        });

    }

    selectedCells = [];

    renderWordList();

    if (foundWords.size === words.length) {

        msg.style.color = "#27ae60";
        msg.textContent =
            "🎉 Вітаємо! Ви знайшли всі 10 слів!";

    }

}

function resetGame() {

    foundWords.clear();
    selectedCells = [];

    document.getElementById("message").textContent = "";

    placeWords();
    renderGrid();
    renderWordList();

}

placeWords();
renderGrid();
renderWordList();

</script>

</body>
</html>
