<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wortsuchrätsel (A1-A2)</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            color: #333;
            text-align: center;
            padding: 15px;
            margin: 0;
            -webkit-user-select: none;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            overflow-x: hidden;
        }
        h1 {
            color: #2c3e50;
            font-size: 1.5rem;
            margin-bottom: 5px;
        }
        .container {
            max-width: 400px;
            width: 100%;
            box-sizing: border-box;
            margin: 0 auto;
            background: #fff;
            padding: 15px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            position: relative;
            z-index: 1;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(10, 1fr);
            gap: 4px;
            margin: 15px 0;
            touch-action: none;
        }
        .cell {
            aspect-ratio: 1;
            background: #eef2f7;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 0.9rem;
            border-radius: 4px;
            cursor: pointer;
            transition: background 0.15s, color 0.15s, transform 0.1s;
        }
        .cell.hint {
            background: #ffeaa7;
            color: #2d3436;
            box-shadow: inset 0 0 0 2px #f39c12;
        }
        .cell.found {
            background: #2ecc71;
            color: white;
        }
        .cell.found.overlap {
            background: #196f3d;
            color: white;
            box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.45);
        }
        .cell.selected {
            background: #3498db;
            color: white;
            transform: scale(1.04);
        }
        .cell.found.selected,
        .cell.found.overlap.selected {
            background: #2471a3;
            color: white;
            box-shadow: inset 0 0 0 2px #ffffff;
        }
        .word-list {
            text-align: left;
            margin-top: 15px;
            font-size: 0.85rem;
            background: #f9f9fb;
            padding: 10px;
            border-radius: 6px;
        }
        .word-list ul {
            margin: 5px 0 0 20px;
            padding: 0;
        }
        .word-item.found {
            text-decoration: line-through;
            color: #7f8c8d;
        }
        .btn-container {
            margin-top: 15px;
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
        }
        button {
            padding: 8px 14px;
            border: none;
            background: #3498db;
            color: white;
            border-radius: 5px;
            cursor: pointer;
            font-size: 0.9rem;
        }
        button:active {
            background: #2980b9;
        }
        button.hint-btn {
            background: #f39c12;
        }
        button.hint-btn:active {
            background: #d68910;
        }
        #message {
            margin-top: 10px;
            font-weight: bold;
            color: #27ae60;
            font-size: 0.95rem;
            min-height: 1.4rem;
        }
        #fireworksCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 999;
            display: none;
        }
    </style>
</head>
<body>

<canvas id="fireworksCanvas"></canvas>

<div class="container">
    <h1>Wortsuchrätsel</h1>
    <p style="font-size: 0.8rem; color: #666; margin-top:0;">Znajdź 10 słów na temat „Firma”</p>
    
    <div class="grid" id="grid"></div>
    
    <div class="btn-container">
        <button class="hint-btn" onclick="showHint()">Podpowiedź</button>
        <button onclick="resetGame()" style="background: #95a5a6;">Reset</button>
    </div>

    <div id="message"></div>

    <div class="word-list">
        <strong>Słowa do znalezienia (A1-A2):</strong>
        <ul id="wordListUI"></ul>
    </div>
</div>

<script>
    const words = [
        { de: "ARBEITEN", pl: "pracować" },
        { de: "LEITEN", pl: "zarządzać" },
        { de: "VERKAUFEN", pl: "sprzedawać" },
        { de: "KAUFEN", pl: "kupować" },
        { de: "PLANEN", pl: "planować" },
        { de: "VERDIENEN", pl: "zarabiać" },
        { de: "BEZAHLEN", pl: "płacić" },
        { de: "BESTELLEN", pl: "zamawiać" },
        { de: "LIEFERN", pl: "dostarczać" },
        { de: "FIRMA", pl: "firma" }
    ];

    const size = 10;
    let grid = [];
    let orientationGrid = []; // 'H' або 'V' для кожної зайнятої літери слова
    let wordPlacements = {};
    let selectedCells = [];
    let foundWords = new Set();
    let isSelecting = false;

    function getWordCoords(word, r, c, horizontal) {
        const coords = [];
        for (let i = 0; i < word.length; i++) {
            const rr = horizontal ? r : r + i;
            const cc = horizontal ? c + i : c;
            coords.push({ r: rr, c: cc, ch: word[i] });
        }
        return coords;
    }

    function formsSubwordInLine(coords, horizontal) {
        const lineStr = coords.map(item => item.ch).join('');
        for (const item of words) {
            const candidate = item.de;
            if (candidate === lineStr) continue;
            if (lineStr.includes(candidate) || candidate.includes(lineStr)) {
                return true;
            }
        }

        // Перевіряємо також повну лінію рядка або стовпця, щоб нове слово не створювало "слово в слові"
        if (horizontal) {
            const r = coords[0].r;
            let rowStr = '';
            for (let c = 0; c < size; c++) {
                const onNew = coords.find(pt => pt.r === r && pt.c === c);
                rowStr += onNew ? onNew.ch : (grid[r][c] || ' ');
            }
            const segments = rowStr.split(' ');
            for (const seg of segments) {
                if (seg.length < 2) continue;
                for (const item of words) {
                    if (seg !== item.de && (seg.includes(item.de) || item.de.includes(seg))) {
                        return true;
                    }
                }
            }
        } else {
            const c = coords[0].c;
            let colStr = '';
            for (let r = 0; r < size; r++) {
                const onNew = coords.find(pt => pt.r === r && pt.c === c);
                colStr += onNew ? onNew.ch : (grid[r][c] || ' ');
            }
            const segments = colStr.split(' ');
            for (const seg of segments) {
                if (seg.length < 2) continue;
                for (const item of words) {
                    if (seg !== item.de && (seg.includes(item.de) || item.de.includes(seg))) {
                        return true;
                    }
                }
            }
        }

        return false;
    }

    function canPlaceAt(word, r, c, horizontal) {
        if (horizontal) {
            if (c < 0 || c + word.length > size || r < 0 || r >= size) return false;
        } else {
            if (r < 0 || r + word.length > size || c < 0 || c >= size) return false;
        }

        const dirTag = horizontal ? 'H' : 'V';
        const coords = getWordCoords(word, r, c, horizontal);

        for (let i = 0; i < coords.length; i++) {
            const { r: rr, c: cc, ch } = coords[i];
            const existingChar = grid[rr][cc];
            const existingOrient = orientationGrid[rr][cc];

            if (existingChar !== '') {
                // Перетин дозволений лише на однаковій літері та з іншим напрямком (H з V або V з H)
                if (existingChar !== ch) return false;
                if (!existingOrient || existingOrient === dirTag) return false;
            }
        }

        if (formsSubwordInLine(coords, horizontal)) {
            return false;
        }

        return true;
    }

    function commitPlacement(word, r, c, horizontal) {
        const dirTag = horizontal ? 'H' : 'V';
        const coords = getWordCoords(word, r, c, horizontal);
        for (let i = 0; i < coords.length; i++) {
            const { r: rr, c: cc, ch } = coords[i];
            grid[rr][cc] = ch;
            orientationGrid[rr][cc] = dirTag;
        }
        wordPlacements[word] = coords.map(({ r: rr, c: cc }) => ({ r: rr, c: cc }));
    }

    function findCrossingCandidates(word, preferHorizontal) {
        const candidates = [];
        for (let i = 0; i < word.length; i++) {
            const ch = word[i];
            for (let r = 0; r < size; r++) {
                for (let c = 0; c < size; c++) {
                    if (grid[r][c] === ch) {
                        // Перетин горизонтального слова з вертикальним (і навпаки)
                        const hCol = c - i;
                        if (orientationGrid[r][c] === 'V' && canPlaceAt(word, r, hCol, true)) {
                            candidates.push({
                                r,
                                c: hCol,
                                horizontal: true,
                                weight: preferHorizontal ? 4 : 2
                            });
                        }

                        const vRow = r - i;
                        if (orientationGrid[r][c] === 'H' && canPlaceAt(word, vRow, c, false)) {
                            candidates.push({
                                r: vRow,
                                c,
                                horizontal: false,
                                weight: !preferHorizontal ? 4 : 2
                            });
                        }
                    }
                }
            }
        }
        return candidates;
    }

    function pickWeightedCandidate(candidates) {
        const total = candidates.reduce((sum, item) => sum + item.weight, 0);
        let roll = Math.random() * total;
        for (const item of candidates) {
            roll -= item.weight;
            if (roll <= 0) return item;
        }
        return candidates[candidates.length - 1];
    }

    function placeWords() {
        let success = false;
        let outerAttempts = 0;

        while (!success && outerAttempts < 250) {
            outerAttempts++;
            grid = Array.from({ length: size }, () => Array(size).fill(''));
            orientationGrid = Array.from({ length: size }, () => Array(size).fill(''));
            wordPlacements = {};
            let placedCount = 0;
            let horizCount = 0;
            let vertCount = 0;

            const sortedWords = [...words].sort((a, b) => b.de.length - a.de.length);

            for (let idx = 0; idx < sortedWords.length; idx++) {
                const word = sortedWords[idx].de;
                let placed = false;

                let preferHorizontal;
                if (horizCount < 3 && idx >= 2) {
                    preferHorizontal = true;
                } else if (vertCount < 3 && idx >= 2) {
                    preferHorizontal = false;
                } else {
                    preferHorizontal = Math.random() < 0.5;
                }

                if (idx > 0 && Math.random() < 0.85) {
                    const crosses = findCrossingCandidates(word, preferHorizontal);
                    if (crosses.length > 0) {
                        const chosen = pickWeightedCandidate(crosses);
                        commitPlacement(word, chosen.r, chosen.c, chosen.horizontal);
                        placed = true;
                        placedCount++;
                        if (chosen.horizontal) horizCount++;
                        else vertCount++;
                    }
                }

                let attempts = 0;
                while (!placed && attempts < 350) {
                    attempts++;
                    const horizontal = attempts < 175
                        ? preferHorizontal
                        : Math.random() < 0.5;
                    const r = Math.floor(Math.random() * size);
                    const c = Math.floor(Math.random() * size);

                    if (canPlaceAt(word, r, c, horizontal)) {
                        commitPlacement(word, r, c, horizontal);
                        placed = true;
                        placedCount++;
                        if (horizontal) horizCount++;
                        else vertCount++;
                    }
                }
            }

            if (placedCount === words.length && horizCount >= 2 && vertCount >= 2) {
                success = true;
            }
        }

        const alphabet = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
        for (let r = 0; r < size; r++) {
            for (let c = 0; c < size; c++) {
                if (!grid[r][c]) {
                    grid[r][c] = alphabet[Math.floor(Math.random() * alphabet.length)];
                }
            }
        }
    }

    function updateFoundColors() {
        const counts = Array.from({ length: size }, () => Array(size).fill(0));

        foundWords.forEach(wordDe => {
            const coords = wordPlacements[wordDe];
            if (!coords) return;
            coords.forEach(({ r, c }) => {
                counts[r][c] += 1;
            });
        });

        document.querySelectorAll('.cell').forEach(cellEl => {
            const r = parseInt(cellEl.dataset.row, 10);
            const c = parseInt(cellEl.dataset.col, 10);
            const count = counts[r][c];

            cellEl.classList.remove('found', 'overlap');
            if (count >= 1) {
                cellEl.classList.add('found');
            }
            if (count >= 2) {
                cellEl.classList.add('overlap');
            }
        });
    }

    function renderGrid() {
        const gridEl = document.getElementById('grid');
        gridEl.innerHTML = '';
        for (let r = 0; r < size; r++) {
            for (let c = 0; c < size; c++) {
                const cell = document.createElement('div');
                cell.className = 'cell';
                cell.dataset.row = r;
                cell.dataset.col = c;
                cell.textContent = grid[r][c];
                gridEl.appendChild(cell);
            }
        }
    }

    function renderWordList() {
        const listEl = document.getElementById('wordListUI');
        listEl.innerHTML = '';
        words.forEach(w => {
            const li = document.createElement('li');
            li.className = 'word-item' + (foundWords.has(w.de) ? ' found' : '');
            li.textContent = `${w.de} — ${w.pl}`;
            listEl.appendChild(li);
        });
    }

    function showHint() {
        const remaining = words.find(w => !foundWords.has(w.de));
        const msg = document.getElementById('message');
        if (!remaining) return;

        const coords = wordPlacements[remaining.de];
        if (!coords || coords.length === 0) return;

        document.querySelectorAll('.cell.hint').forEach(c => c.classList.remove('hint'));

        const first = coords[0];
        const cellEl = document.querySelector(`.cell[data-row="${first.r}"][data-col="${first.c}"]`);
        if (cellEl) {
            cellEl.classList.add('hint');
        }

        msg.style.color = '#d68910';
        msg.textContent = `Pierwsza litera słowa „${remaining.pl}”: ${grid[first.r][first.c]}`;
    }

    const gridElement = document.getElementById('grid');

    function getCellFromPoint(x, y) {
        const element = document.elementFromPoint(x, y);
        if (!element) return null;
        return element.classList.contains('cell') ? element : element.closest('.cell');
    }

    function addCellToSelection(cell) {
        if (!cell) return;
        const r = parseInt(cell.dataset.row, 10);
        const c = parseInt(cell.dataset.col, 10);

        if (!selectedCells.some(item => item.r === r && item.c === c)) {
            selectedCells.push({ r, c, element: cell });
            cell.classList.add('selected');
        }
    }

    function clearSelectionUI() {
        document.querySelectorAll('.cell.selected').forEach(c => c.classList.remove('selected'));
    }

    function startSelection(cell) {
        isSelecting = true;
        selectedCells = [];
        clearSelectionUI();
        if (cell) {
            addCellToSelection(cell);
        }
    }

    function moveSelection(cell) {
        if (!isSelecting || !cell) return;
        addCellToSelection(cell);
    }

    function finishSelection(lastCell) {
        if (!isSelecting) return;
        if (lastCell) {
            addCellToSelection(lastCell);
        }
        isSelecting = false;
        checkSelection();
    }

    function handleMouseDown(e) {
        if (e.button !== 0) return;
        const cell = getCellFromPoint(e.clientX, e.clientY);
        startSelection(cell);
    }

    function handleMouseMove(e) {
        if (!isSelecting) return;
        const cell = getCellFromPoint(e.clientX, e.clientY);
        moveSelection(cell);
    }

    function handleMouseUp(e) {
        if (!isSelecting) return;
        const cell = getCellFromPoint(e.clientX, e.clientY);
        finishSelection(cell);
    }

    function handleTouchStart(e) {
        if (!e.touches || e.touches.length === 0) return;
        const touch = e.touches[0];
        const cell = getCellFromPoint(touch.clientX, touch.clientY);
        startSelection(cell);
    }

    function handleTouchMove(e) {
        if (!isSelecting || !e.touches || e.touches.length === 0) return;
        const touch = e.touches[0];
        const cell = getCellFromPoint(touch.clientX, touch.clientY);
        moveSelection(cell);
    }

    function handleTouchEnd(e) {
        if (!isSelecting) return;
        let lastCell = null;
        if (e.changedTouches && e.changedTouches.length > 0) {
            const touch = e.changedTouches[0];
            lastCell = getCellFromPoint(touch.clientX, touch.clientY);
        }
        finishSelection(lastCell);
    }

    function checkSelection() {
        if (selectedCells.length === 0) return;

        const ordered = [...selectedCells].sort((a, b) => a.r - b.r || a.c - b.c);
        const wordStr = ordered.map(item => grid[item.r][item.c]).join('');
        const reversedStr = wordStr.split('').reverse().join('');

        const matched = words.find(w => w.de === wordStr || w.de === reversedStr);
        const msg = document.getElementById('message');

        if (matched && !foundWords.has(matched.de)) {
            foundWords.add(matched.de);
            ordered.forEach(item => {
                item.element.classList.remove('selected');
                item.element.classList.remove('hint');
            });
            updateFoundColors();
            msg.style.color = '#27ae60';
            msg.textContent = `Znaleziono słowo: ${matched.de}!`;
            setTimeout(() => {
                if (foundWords.size < words.length) {
                    msg.textContent = '';
                }
            }, 2000);
        } else {
            msg.style.color = '#e74c3c';
            msg.textContent = matched && foundWords.has(matched.de) ? 'To słowo już znaleziono' : 'Niepoprawnie';
            setTimeout(() => {
                if (foundWords.size < words.length) {
                    msg.textContent = '';
                }
            }, 1500);
            clearSelectionUI();
        }

        selectedCells = [];
        renderWordList();

        if (foundWords.size === words.length) {
            document.querySelectorAll('.cell.hint').forEach(c => c.classList.remove('hint'));
            msg.style.color = '#27ae60';
            msg.textContent = 'Brawo! Świetna robota — wszystkie słowa znalezione!';
            launchFireworks();
        }
    }

    gridElement.addEventListener('mousedown', handleMouseDown);
    document.addEventListener('mousemove', handleMouseMove);
    document.addEventListener('mouseup', handleMouseUp);

    gridElement.addEventListener('touchstart', handleTouchStart, { passive: true });
    gridElement.addEventListener('touchmove', handleTouchMove, { passive: true });
    document.addEventListener('touchend', handleTouchEnd);
    document.addEventListener('touchcancel', handleTouchEnd);

    // --- Анімація салюту ---
    const canvas = document.getElementById('fireworksCanvas');
    const ctx = canvas.getContext('2d');
    let particles = [];
    let fireworksTimer = null;
    let animationFrameId = null;

    function resizeCanvas() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    function createBurst(x, y) {
        const colors = ['#ff4757', '#ffa502', '#2ed573', '#1e90ff', '#ff6b81', '#eccc68', '#a55eea'];
        const count = 45;
        for (let i = 0; i < count; i++) {
            const angle = (Math.PI * 2 * i) / count + (Math.random() - 0.5) * 0.2;
            const speed = 2 + Math.random() * 5;
            particles.push({
                x,
                y,
                vx: Math.cos(angle) * speed,
                vy: Math.sin(angle) * speed,
                alpha: 1,
                decay: 0.015 + Math.random() * 0.015,
                color: colors[Math.floor(Math.random() * colors.length)],
                radius: 2.5 + Math.random() * 2.5
            });
        }
    }

    function animateFireworks() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        for (let i = particles.length - 1; i >= 0; i--) {
            const p = particles[i];
            p.x += p.vx;
            p.y += p.vy;
            p.vy += 0.06;
            p.vx *= 0.99;
            p.alpha -= p.decay;

            if (p.alpha <= 0) {
                particles.splice(i, 1);
                continue;
            }

            ctx.save();
            ctx.globalAlpha = Math.max(0, p.alpha);
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
            ctx.fillStyle = p.color;
            ctx.fill();
            ctx.restore();
        }

        if (particles.length > 0 || fireworksTimer !== null) {
            animationFrameId = requestAnimationFrame(animateFireworks);
        } else {
            canvas.style.display = 'none';
        }
    }

    function launchFireworks() {
        stopFireworks();
        resizeCanvas();
        canvas.style.display = 'block';

        const spawnBurst = () => {
            const x = canvas.width * (0.2 + Math.random() * 0.6);
            const y = canvas.height * (0.15 + Math.random() * 0.45);
            createBurst(x, y);
        };

        spawnBurst();
        setTimeout(spawnBurst, 350);
        setTimeout(spawnBurst, 700);

        let burstsLeft = 6;
        fireworksTimer = setInterval(() => {
            spawnBurst();
            burstsLeft--;
            if (burstsLeft <= 0) {
                clearInterval(fireworksTimer);
                fireworksTimer = null;
            }
        }, 550);

        animationFrameId = requestAnimationFrame(animateFireworks);
    }

    function stopFireworks() {
        if (fireworksTimer !== null) {
            clearInterval(fireworksTimer);
            fireworksTimer = null;
        }
        if (animationFrameId !== null) {
            cancelAnimationFrame(animationFrameId);
            animationFrameId = null;
        }
        particles = [];
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        canvas.style.display = 'none';
    }

    function resetGame() {
        stopFireworks();
        document.querySelectorAll('.cell.hint').forEach(c => c.classList.remove('hint'));
        foundWords.clear();
        selectedCells = [];
        isSelecting = false;
        document.getElementById('message').textContent = '';
        placeWords();
        renderGrid();
        renderWordList();
    }

    resetGame();
</script>

</body>
</html>
