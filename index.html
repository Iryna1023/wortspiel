<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wortsuchrätsel (A1-A2)</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            color: #333;
            text-align: center;
            padding: 15px;
            margin: 0;
            -webkit-user-select: none;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            overflow-x: hidden;
        }
        h1 {
            color: #2c3e50;
            font-size: 1.5rem;
            margin-bottom: 5px;
        }
        .container {
            max-width: 400px;
            width: 100%;
            box-sizing: border-box;
            margin: 0 auto;
            background: #fff;
            padding: 15px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            position: relative;
            z-index: 1;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(10, 1fr);
            gap: 4px;
            margin: 15px 0;
            touch-action: none;
        }
        .cell {
            aspect-ratio: 1;
            background: #eef2f7;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 0.9rem;
            border-radius: 4px;
            cursor: pointer;
            transition: background 0.15s, color 0.15s, transform 0.1s;
        }
        .cell.found {
            background: #2ecc71;
            color: white;
        }
        .cell.selected {
            background: #3498db;
            color: white;
            transform: scale(1.04);
        }
        .cell.found.selected {
            background: #1abc9c;
            color: white;
            box-shadow: inset 0 0 0 2px #ffffff;
        }
        .word-list {
            text-align: left;
            margin-top: 15px;
            font-size: 0.85rem;
            background: #f9f9fb;
            padding: 10px;
            border-radius: 6px;
        }
        .word-list ul {
            margin: 5px 0 0 20px;
            padding: 0;
        }
        .word-item.found {
            text-decoration: line-through;
            color: #7f8c8d;
        }
        .btn-container {
            margin-top: 15px;
            display: flex;
            gap: 10px;
            justify-content: center;
        }
        button {
            padding: 8px 14px;
            border: none;
            background: #3498db;
            color: white;
            border-radius: 5px;
            cursor: pointer;
            font-size: 0.9rem;
        }
        button:active {
            background: #2980b9;
        }
        #message {
            margin-top: 10px;
            font-weight: bold;
            color: #27ae60;
            font-size: 0.95rem;
            min-height: 1.4rem;
        }
        #fireworksCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 999;
            display: none;
        }
    </style>
</head>
<body>

<canvas id="fireworksCanvas"></canvas>

<div class="container">
    <h1>Wortsuchrätsel</h1>
    <p style="font-size: 0.8rem; color: #666; margin-top:0;">Znajdź 10 słów na temat „Firma”</p>
    
    <div class="grid" id="grid"></div>
    
    <div class="btn-container">
        <button onclick="resetGame()" style="background: #95a5a6;">Reset</button>
    </div>

    <div id="message"></div>

    <div class="word-list">
        <strong>Słowa do znalezienia (A1-A2):</strong>
        <ul id="wordListUI"></ul>
    </div>
</div>

<script>
    const words = [
        { de: "ARBEITEN", pl: "pracować" },
        { de: "LEITEN", pl: "zarządzać" },
        { de: "VERKAUFEN", pl: "sprzedawać" },
        { de: "KAUFEN", pl: "kupować" },
        { de: "PLANEN", pl: "planować" },
        { de: "VERDIENEN", pl: "zarabiać" },
        { de: "BEZAHLEN", pl: "płacić" },
        { de: "BESTELLEN", pl: "zamawiać" },
        { de: "LIEFERN", pl: "dostarczać" },
        { de: "FIRMA", pl: "firma" }
    ];

    const size = 10;
    let grid = [];
    let selectedCells = [];
    let foundWords = new Set();
    let isSelecting = false;

    function placeWords() {
        let success = false;
        while (!success) {
            grid = Array.from({ length: size }, () => Array(size).fill(''));
            let placedCount = 0;
            const sortedWords = [...words].sort((a, b) => b.de.length - a.de.length);

            for (const item of sortedWords) {
                const word = item.de;
                let placed = false;
                let attempts = 0;

                while (!placed && attempts < 300) {
                    attempts++;
                    const horizontal = Math.random() < 0.5;
                    const r = Math.floor(Math.random() * size);
                    const c = Math.floor(Math.random() * size);

                    if (horizontal && c + word.length <= size) {
                        let canPlace = true;
                        for (let i = 0; i < word.length; i++) {
                            if (grid[r][c + i] !== '' && grid[r][c + i] !== word[i]) {
                                canPlace = false;
                                break;
                            }
                        }
                        if (canPlace) {
                            for (let i = 0; i < word.length; i++) {
                                grid[r][c + i] = word[i];
                            }
                            placed = true;
                            placedCount++;
                        }
                    } else if (!horizontal && r + word.length <= size) {
                        let canPlace = true;
                        for (let i = 0; i < word.length; i++) {
                            if (grid[r + i][c] !== '' && grid[r + i][c] !== word[i]) {
                                canPlace = false;
                                break;
                            }
                        }
                        if (canPlace) {
                            for (let i = 0; i < word.length; i++) {
                                grid[r + i][c] = word[i];
                            }
                            placed = true;
                            placedCount++;
                        }
                    }
                }
            }
            if (placedCount === words.length) {
                success = true;
            }
        }

        const alphabet = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
        for (let r = 0; r < size; r++) {
            for (let c = 0; c < size; c++) {
                if (!grid[r][c]) {
                    grid[r][c] = alphabet[Math.floor(Math.random() * alphabet.length)];
                }
            }
        }
    }

    function renderGrid() {
        const gridEl = document.getElementById('grid');
        gridEl.innerHTML = '';
        for (let r = 0; r < size; r++) {
            for (let c = 0; c < size; c++) {
                const cell = document.createElement('div');
                cell.className = 'cell';
                cell.dataset.row = r;
                cell.dataset.col = c;
                cell.textContent = grid[r][c];
                gridEl.appendChild(cell);
            }
        }
    }

    function renderWordList() {
        const listEl = document.getElementById('wordListUI');
        listEl.innerHTML = '';
        words.forEach(w => {
            const li = document.createElement('li');
            li.className = 'word-item' + (foundWords.has(w.de) ? ' found' : '');
            li.textContent = `${w.de} — ${w.pl}`;
            listEl.appendChild(li);
        });
    }

    const gridElement = document.getElementById('grid');

    function getCellFromPoint(x, y) {
        const element = document.elementFromPoint(x, y);
        if (!element) return null;
        return element.classList.contains('cell') ? element : element.closest('.cell');
    }

    function addCellToSelection(cell) {
        if (!cell) return;
        const r = parseInt(cell.dataset.row, 10);
        const c = parseInt(cell.dataset.col, 10);

        if (!selectedCells.some(item => item.r === r && item.c === c)) {
            selectedCells.push({ r, c, element: cell });
            cell.classList.add('selected');
        }
    }

    function clearSelectionUI() {
        document.querySelectorAll('.cell.selected').forEach(c => c.classList.remove('selected'));
    }

    function startSelection(cell) {
        isSelecting = true;
        selectedCells = [];
        clearSelectionUI();
        if (cell) {
            addCellToSelection(cell);
        }
    }

    function moveSelection(cell) {
        if (!isSelecting || !cell) return;
        addCellToSelection(cell);
    }

    function finishSelection(lastCell) {
        if (!isSelecting) return;
        if (lastCell) {
            addCellToSelection(lastCell);
        }
        isSelecting = false;
        checkSelection();
    }

    function handleMouseDown(e) {
        if (e.button !== 0) return;
        const cell = getCellFromPoint(e.clientX, e.clientY);
        startSelection(cell);
    }

    function handleMouseMove(e) {
        if (!isSelecting) return;
        const cell = getCellFromPoint(e.clientX, e.clientY);
        moveSelection(cell);
    }

    function handleMouseUp(e) {
        if (!isSelecting) return;
        const cell = getCellFromPoint(e.clientX, e.clientY);
        finishSelection(cell);
    }

    function handleTouchStart(e) {
        if (!e.touches || e.touches.length === 0) return;
        const touch = e.touches[0];
        const cell = getCellFromPoint(touch.clientX, touch.clientY);
        startSelection(cell);
    }

    function handleTouchMove(e) {
        if (!isSelecting || !e.touches || e.touches.length === 0) return;
        const touch = e.touches[0];
        const cell = getCellFromPoint(touch.clientX, touch.clientY);
        moveSelection(cell);
    }

    function handleTouchEnd(e) {
        if (!isSelecting) return;
        let lastCell = null;
        if (e.changedTouches && e.changedTouches.length > 0) {
            const touch = e.changedTouches[0];
            lastCell = getCellFromPoint(touch.clientX, touch.clientY);
        }
        finishSelection(lastCell);
    }

    function checkSelection() {
        if (selectedCells.length === 0) return;

        const ordered = [...selectedCells].sort((a, b) => a.r - b.r || a.c - b.c);
        const wordStr = ordered.map(item => grid[item.r][item.c]).join('');
        const reversedStr = wordStr.split('').reverse().join('');

        const matched = words.find(w => w.de === wordStr || w.de === reversedStr);
        const msg = document.getElementById('message');

        if (matched && !foundWords.has(matched.de)) {
            foundWords.add(matched.de);
            ordered.forEach(item => {
                item.element.classList.remove('selected');
                item.element.classList.add('found');
            });
            msg.style.color = '#27ae60';
            msg.textContent = `Znaleziono słowo: ${matched.de}!`;
            setTimeout(() => {
                if (foundWords.size < words.length) {
                    msg.textContent = '';
                }
            }, 2000);
        } else {
            msg.style.color = '#e74c3c';
            msg.textContent = matched && foundWords.has(matched.de) ? 'To słowo już znaleziono' : 'Niepoprawnie';
            setTimeout(() => {
                if (foundWords.size < words.length) {
                    msg.textContent = '';
                }
            }, 1500);
            clearSelectionUI();
        }

        selectedCells = [];
        renderWordList();

        if (foundWords.size === words.length) {
            msg.style.color = '#27ae60';
            msg.textContent = 'Brawo! Świetna robota — wszystkie słowa znalezione!';
            launchFireworks();
        }
    }

    gridElement.addEventListener('mousedown', handleMouseDown);
    document.addEventListener('mousemove', handleMouseMove);
    document.addEventListener('mouseup', handleMouseUp);

    gridElement.addEventListener('touchstart', handleTouchStart, { passive: true });
    gridElement.addEventListener('touchmove', handleTouchMove, { passive: true });
    document.addEventListener('touchend', handleTouchEnd);
    document.addEventListener('touchcancel', handleTouchEnd);

    // --- Анімація салюту ---
    const canvas = document.getElementById('fireworksCanvas');
    const ctx = canvas.getContext('2d');
    let particles = [];
    let fireworksTimer = null;
    let animationFrameId = null;

    function resizeCanvas() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    function createBurst(x, y) {
        const colors = ['#ff4757', '#ffa502', '#2ed573', '#1e90ff', '#ff6b81', '#eccc68', '#a55eea'];
        const count = 45;
        for (let i = 0; i < count; i++) {
            const angle = (Math.PI * 2 * i) / count + (Math.random() - 0.5) * 0.2;
            const speed = 2 + Math.random() * 5;
            particles.push({
                x,
                y,
                vx: Math.cos(angle) * speed,
                vy: Math.sin(angle) * speed,
                alpha: 1,
                decay: 0.015 + Math.random() * 0.015,
                color: colors[Math.floor(Math.random() * colors.length)],
                radius: 2.5 + Math.random() * 2.5
            });
        }
    }

    function animateFireworks() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        for (let i = particles.length - 1; i >= 0; i--) {
            const p = particles[i];
            p.x += p.vx;
            p.y += p.vy;
            p.vy += 0.06; // легка гравітація
            p.vx *= 0.99;
            p.alpha -= p.decay;

            if (p.alpha <= 0) {
                particles.splice(i, 1);
                continue;
            }

            ctx.save();
            ctx.globalAlpha = Math.max(0, p.alpha);
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
            ctx.fillStyle = p.color;
            ctx.fill();
            ctx.restore();
        }

        if (particles.length > 0 || fireworksTimer !== null) {
            animationFrameId = requestAnimationFrame(animateFireworks);
        } else {
            canvas.style.display = 'none';
        }
    }

    function launchFireworks() {
        stopFireworks();
        resizeCanvas();
        canvas.style.display = 'block';

        const spawnBurst = () => {
            const x = canvas.width * (0.2 + Math.random() * 0.6);
            const y = canvas.height * (0.15 + Math.random() * 0.45);
            createBurst(x, y);
        };

        spawnBurst();
        setTimeout(spawnBurst, 350);
        setTimeout(spawnBurst, 700);

        let burstsLeft = 6;
        fireworksTimer = setInterval(() => {
            spawnBurst();
            burstsLeft--;
            if (burstsLeft <= 0) {
                clearInterval(fireworksTimer);
                fireworksTimer = null;
            }
        }, 550);

        animationFrameId = requestAnimationFrame(animateFireworks);
    }

    function stopFireworks() {
        if (fireworksTimer !== null) {
            clearInterval(fireworksTimer);
            fireworksTimer = null;
        }
        if (animationFrameId !== null) {
            cancelAnimationFrame(animationFrameId);
            animationFrameId = null;
        }
        particles = [];
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        canvas.style.display = 'none';
    }

    function resetGame() {
        stopFireworks();
        foundWords.clear();
        selectedCells = [];
        isSelecting = false;
        document.getElementById('message').textContent = '';
        placeWords();
        renderGrid();
        renderWordList();
    }

    resetGame();
</script>

</body>
</html>
